<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>药学院每周工作计划</title>
<style>
:root{--navy:#16324f;--navy2:#1e4468;--ink:#eaf2f8;--mute:#9fb6c9}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:
  radial-gradient(120% 80% at 50% 0%,#26557d 0%,#16324f 45%,#0f2237 100%);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px;-webkit-font-smoothing:antialiased}
.box{max-width:420px;width:100%;text-align:center}
.brand{font-size:11.5px;letter-spacing:8px;color:var(--mute);margin-bottom:22px}
h1{font-size:26px;font-weight:800;letter-spacing:2px;margin:0 0 10px}
p{font-size:13px;color:var(--mute);line-height:1.9;margin:0 0 30px}
.go{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 34px;border-radius:14px;
  background:#fff;color:var(--navy);font-weight:700;font-size:15px;text-decoration:none;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .18s}
.go:active{transform:scale(.98)}
.line{height:2px;width:100%;background:rgba(255,255,255,.14);margin-top:34px;overflow:hidden;border-radius:2px}
.line i{display:block;height:100%;width:38%;background:rgba(255,255,255,.6);border-radius:2px;
  animation:run 1.1s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){.line i{animation:none;width:100%;opacity:.4}}
</style>
</head>
<body>
<div class="box">
  <div class="brand">肇 庆 医 学 院 · 药 学 院</div>
  <h1>每周工作计划</h1>
  <p>正在打开系统…</p>
  <a class="go" id="go" href="https://pharmacy-week-plan.app.workbuddy.host/?sharecode=XKGUZCHHUF">立即进入</a>
  <div class="line"><i></i></div>
</div>
<script>
var url = 'https://pharmacy-week-plan.app.workbuddy.host/?sharecode=XKGUZCHHUF';
setTimeout(function(){ location.replace(url); }, 700);
</script>
</body>
</html>
